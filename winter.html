<body><script>
    let month=10;
switch(month){
    case 12||1||2:
        console.log("Winter");
        break;
    case 3||4||5:
        console.log("spring");
        break;
        case 9||10||11:
        console.log("Autumn");  
        break;  
        default:
        console.log("invalid month");  
        break; 
}
</script>
